<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORIGIN">
<title>ORIGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E10; --surface:#161619; --surface2:#1C1C20;
  --line:#3A3A41; --line-soft:#2C2C31;
  --ink-faint:#63636E; --ink-dim:#A4A4B0; --ink-mid:#D2D2DA; --ink:#F4F4F8; --white:#FFFFFF;
  --radius:14px; --pill:100px;
}
body.light{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#EEEDE8;
  --line:#AEAEA5; --line-soft:#C4C4BC;
  --ink-faint:#807F76; --ink-dim:#54544C; --ink-mid:#2C2C27; --ink:#121210; --white:#000000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;
  height:100%;overflow:hidden;overscroll-behavior:none;
  transition:background .3s,color .3s;
}
button{font-family:inherit}
.hidden{display:none!important}

#app{position:relative;height:100%;display:flex;flex-direction:column}
#app.vhfix{height:calc(var(--vh,1vh)*100)}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}

/* header */
.m-head{
  padding:calc(16px + env(safe-area-inset-top)) 22px 13px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  border-bottom:1px solid var(--line-soft);
}
.m-logo{font-family:'Fraunces',serif;font-size:16px;letter-spacing:.4em;text-indent:.4em;color:var(--white)}
.m-sec{flex:1;text-align:right;font-family:'JetBrains Mono',monospace;font-size:calc(10px * var(--fs,1));letter-spacing:.15em;color:var(--ink-dim);text-transform:uppercase}
.iconbtn{
  background:none;border:none;padding:6px;cursor:pointer;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;transition:color .2s;flex-shrink:0;
}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.m-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.m-scroll::-webkit-scrollbar{width:4px}
.m-scroll::-webkit-scrollbar-track{background:transparent}
.m-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.m-scroll::-webkit-scrollbar-button{display:none!important;height:0;width:0}

/* tab bar */
.tabbar{
  flex-shrink:0;display:flex;border-top:1px solid var(--line-soft);
  padding:8px 8px calc(6px + env(safe-area-inset-bottom));background:var(--bg);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;
  color:var(--ink-faint);cursor:pointer;transition:color .2s;
  font-family:'JetBrains Mono',monospace;font-size:calc(8.5px * var(--fs,1));letter-spacing:.1em;text-transform:uppercase;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--white)}

/* placeholder pages */
.ph{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px;text-align:center;
}
.ph .ph-mark{
  width:52px;height:52px;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
}
.ph .ph-mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ph p{font-family:'JetBrains Mono',monospace;font-size:calc(10px * var(--fs,1));letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}

/* options */
.opts-page{padding:8px 22px 40px}
.o-row{padding:20px 0;border-bottom:1px solid var(--line-soft)}
.opts-label{font-family:'JetBrains Mono',monospace;font-size:calc(10px * var(--fs,1));letter-spacing:.2em;color:var(--ink-mid);text-transform:uppercase;margin-bottom:13px}
.opts-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  min-width:54px;text-align:center;border:1px solid var(--line);color:var(--ink-dim);
  font-size:calc(12.5px * var(--fs,1));padding:10px 17px;cursor:pointer;border-radius:var(--pill);
  transition:all .2s;
}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.o-row input[type=text]{
  width:100%;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-family:'Manrope',sans-serif;font-weight:300;
  font-size:max(16px, calc(16px * var(--fs,1)));
  padding:13px 18px;border-radius:var(--pill);
}
.o-row input[type=text]:focus{outline:none;border-color:var(--ink-mid)}
#lblFont{display:flex;justify-content:space-between;align-items:baseline}
.fs-val{font-family:'JetBrains Mono',monospace;font-size:calc(11px * var(--fs,1));letter-spacing:.05em;color:var(--ink-dim);text-transform:none}
input[type=range].fs{
  width:100%;-webkit-appearance:none;appearance:none;height:26px;background:transparent;cursor:pointer;
}
input[type=range].fs::-webkit-slider-runnable-track{
  height:1px;
  background:linear-gradient(90deg,var(--line) 0 calc(50% - 1px),var(--ink-dim) calc(50% - 1px) calc(50% + 1px),var(--line) calc(50% + 1px) 100%);
}
input[type=range].fs::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--ink);margin-top:-7px;border:none;
}
input[type=range].fs::-moz-range-track{
  height:1px;
  background:linear-gradient(90deg,var(--line) 0 calc(50% - 1px),var(--ink-dim) calc(50% - 1px) calc(50% + 1px),var(--line) calc(50% + 1px) 100%);
}
input[type=range].fs::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--ink);border:none}
.fs-note{font-size:calc(13px * var(--fs,1));color:var(--ink-mid);line-height:1.7;margin-top:14px}
.opts-manual{
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  padding:20px 0;border-bottom:1px solid var(--line-soft);
  font-size:calc(14.5px * var(--fs,1));color:var(--ink);
}
.opts-manual .om-arrow{color:var(--ink-faint)}
.f-c{
  padding:24px 0 10px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:calc(9px * var(--fs,1));letter-spacing:.12em;color:var(--ink-mid);
}
.f-c b{color:var(--ink);font-weight:400}
.f-sep{margin:0 9px;color:var(--ink-faint)}
.f-link{color:var(--ink);cursor:pointer}

/* guide */
.guide{
  position:fixed;inset:0;background:var(--bg);z-index:85;
  display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.guide.show{display:block}
.guide-head{
  position:sticky;top:0;background:var(--bg);z-index:5;
  display:flex;align-items:center;gap:16px;
  padding:calc(18px + env(safe-area-inset-top)) 22px 14px;
  border-bottom:1px solid var(--line-soft);
}
.g-logo{font-family:'Fraunces',serif;font-size:15px;letter-spacing:.4em;color:var(--white)}
.g-title{flex:1;font-family:'JetBrains Mono',monospace;font-size:calc(10px * var(--fs,1));letter-spacing:.2em;text-transform:uppercase;color:var(--ink-mid);text-align:right;margin-right:4px}
.guide-body{padding:10px 22px calc(50px + env(safe-area-inset-bottom))}
.guide-body section{padding:22px 0;border-bottom:1px solid var(--line-soft)}
.guide-body section:last-child{border-bottom:none}
.guide-body h2{font-family:'Fraunces',serif;font-weight:400;font-size:calc(18.5px * var(--fs,1));color:var(--white);margin-bottom:10px}
.guide-body p{font-size:calc(13.5px * var(--fs,1));font-weight:300;color:var(--ink-mid);line-height:1.75;margin-bottom:8px}

/* modals / lock / toast */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;
  display:none;align-items:center;justify-content:center;padding:24px;
}
body.light .modal-back{background:rgba(40,40,36,.35)}
.modal-back.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 24px;width:100%;max-width:360px;max-height:82vh;overflow-y:auto;
  text-align:center;
}
.modal h2{font-family:'Fraunces',serif;font-weight:400;font-size:calc(19px * var(--fs,1));color:var(--white);margin-bottom:12px}
.modal p{font-size:calc(13.5px * var(--fs,1));color:var(--ink-mid);line-height:1.7;white-space:pre-line}
.pw-input{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:max(16px, calc(16px * var(--fs,1)));letter-spacing:.1em;
  padding:13px 18px;border-radius:var(--pill);margin:16px 0 4px;text-align:center;
}
.pw-input:focus{outline:none;border-color:var(--ink-mid)}
.m-btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
.btn{
  border-radius:var(--pill);cursor:pointer;font-family:'JetBrains Mono',monospace;
  font-size:calc(10.5px * var(--fs,1));letter-spacing:.12em;text-transform:uppercase;
  padding:15px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;border:1px solid transparent;flex:1;
}
.btn-ghost{background:none;border-color:var(--line);color:var(--ink-dim)}
.btn-solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.c-mail{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:calc(12.5px * var(--fs,1));
  color:var(--ink);text-decoration:none;border:1px solid var(--line);
  border-radius:var(--pill);padding:13px 22px;margin-top:12px;
}
.lockscreen{
  position:fixed;inset:0;background:var(--bg);z-index:80;
  display:none;align-items:center;justify-content:center;padding:24px;
}
.lockscreen.show{display:flex}
.lock-inner{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(300px,86vw);text-align:center}
.lock-logo{font-family:'Fraunces',serif;font-size:22px;letter-spacing:.45em;text-indent:.45em;color:var(--white);margin-bottom:6px}
.lockscreen p{font-size:calc(13px * var(--fs,1));color:var(--ink-mid)}
.lockscreen .pw-input{margin:0;max-width:210px;letter-spacing:.4em}
.lockscreen .btn{padding:13px 44px;flex:none}
.lock-forgot{
  font-family:'JetBrains Mono',monospace;font-size:calc(9.5px * var(--fs,1));letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);cursor:pointer;margin-top:8px;
}
.toast{
  position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:calc(10px * var(--fs,1));letter-spacing:.12em;text-transform:uppercase;
  padding:12px 26px;border-radius:var(--pill);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;z-index:120;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="app">
<div class="views">

  <!-- ============ DASHBOARD ============ -->
  <section class="view active" id="dash">
    <div class="m-head">
      <span class="m-logo">ORIGIN</span>
      <span class="m-sec" id="hDate"></span>
    </div>
    <div class="ph">
      <div class="ph-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div>
      <p id="phDash"></p>
    </div>
  </section>

  <!-- ============ OGGI ============ -->
  <section class="view" id="today">
    <div class="m-head">
      <span class="m-logo">ORIGIN</span>
      <span class="m-sec" id="todaySec"></span>
    </div>
    <div class="ph">
      <div class="ph-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></div>
      <p id="phToday"></p>
    </div>
  </section>

  <!-- ============ DATI ============ -->
  <section class="view" id="data">
    <div class="m-head">
      <span class="m-logo">ORIGIN</span>
      <span class="m-sec" id="dataSec"></span>
    </div>
    <div class="ph">
      <div class="ph-mark"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 21h16"/></svg></div>
      <p id="phData"></p>
    </div>
  </section>

  <!-- ============ OPZIONI ============ -->
  <section class="view" id="opts">
    <div class="m-head">
      <span class="m-logo">ORIGIN</span>
      <span class="m-sec" id="optsSec"></span>
    </div>
    <div class="m-scroll">
      <div class="opts-page">

        <div class="o-row">
          <div class="opts-label" id="lblLang"></div>
          <div class="opts-row" id="langChips">
            <div class="chip" data-lang="en">EN</div>
            <div class="chip" data-lang="it">IT</div>
            <div class="chip" data-lang="ua">UA</div>
            <div class="chip" data-lang="ru">RU</div>
          </div>
        </div>

        <div class="o-row">
          <div class="opts-label" id="lblTheme"></div>
          <div class="opts-row">
            <div class="chip" id="chipDark" onclick="setTheme('dark')"></div>
            <div class="chip" id="chipLight" onclick="setTheme('light')"></div>
          </div>
        </div>

        <div class="o-row">
          <div class="opts-label" id="lblFont"><span id="lblFontT"></span><span class="fs-val" id="fsVal"></span></div>
          <input type="range" class="fs" id="fsSlider" min="60" max="140" step="10" value="100"
                 oninput="setFontScale(this.value)">
          <p class="fs-note" id="fsNote"></p>
        </div>

        <div class="o-row">
          <div class="opts-label" id="lblMyName"></div>
          <input type="text" id="inpMyName" onchange="setName(this.value)">
        </div>

        <div class="o-row">
          <div class="opts-label" id="lblLock"></div>
          <div class="opts-row">
            <div class="chip" id="chipPwSet" onclick="setLockPw()"></div>
            <div class="chip hidden" id="chipPwRem" onclick="removeLockPw()"></div>
          </div>
        </div>

        <div class="opts-manual" onclick="toast(T().soon)">
          <span id="lblConstructor"></span><span class="om-arrow">→</span>
        </div>

        <div class="opts-manual" onclick="openManual()">
          <span id="lblManual"></span><span class="om-arrow">→</span>
        </div>

        <div class="f-c">ORIGIN · <b onclick="diag()" style="cursor:pointer">v 0.1</b> · 2026 · <b>Dimitri Soprani</b><span class="f-sep">│</span><a class="f-link" onclick="openContact()">Contact me</a></div>

      </div>
    </div>
  </section>

</div>

<!-- ============ TAB BAR ============ -->
<div class="tabbar">
  <button class="tab on" id="tabDash" onclick="show('dash')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
    <span id="tabDashL"></span>
  </button>
  <button class="tab" id="tabToday" onclick="show('today')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
    <span id="tabTodayL"></span>
  </button>
  <button class="tab" id="tabData" onclick="show('data')">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 21h16"/></svg>
    <span id="tabDataL"></span>
  </button>
  <button class="tab" id="tabOpts" onclick="show('opts')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
    <span id="tabOptsL"></span>
  </button>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ MODALS ============ -->
<div class="modal-back" id="pwModal">
  <div class="modal">
    <h2 id="pwTitle"></h2>
    <p id="pwText"></p>
    <input type="password" class="pw-input" id="pwInput" autocomplete="off">
    <div class="m-btns">
      <button class="btn btn-ghost" id="pwCancel"></button>
      <button class="btn btn-solid" id="pwOk">OK</button>
    </div>
  </div>
</div>

<div class="modal-back" id="cfModal">
  <div class="modal">
    <h2 id="cfTitle"></h2>
    <p id="cfText"></p>
    <div class="m-btns">
      <button class="btn btn-ghost" id="cfCancel"></button>
      <button class="btn btn-solid" id="cfOk"></button>
    </div>
  </div>
</div>

<div class="modal-back" id="contactModal" onclick="if(event.target.id==='contactModal')this.classList.remove('open')">
  <div class="modal">
    <h2>Contact</h2>
    <p id="contactTxt"></p>
    <a class="c-mail" href="mailto:d32946477770@gmail.com">d32946477770@gmail.com</a>
    <div class="m-btns">
      <button class="btn btn-ghost" onclick="document.getElementById('contactModal').classList.remove('open')" id="contactClose"></button>
    </div>
  </div>
</div>

<!-- ============ GUIDE ============ -->
<div class="guide" id="guideModal">
  <div class="guide-head">
    <span class="g-logo">ORIGIN</span>
    <span class="g-title" id="guideTitle"></span>
    <button class="iconbtn" onclick="closeGuide()">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="guide-body" id="guideBody"></div>
</div>

<!-- ============ LOCK SCREEN ============ -->
<div class="lockscreen" id="lockScreen">
  <div class="lock-inner">
    <div class="lock-logo">ORIGIN</div>
    <p id="lockText"></p>
    <input type="password" class="pw-input" id="lockInput" maxlength="6" autocomplete="off">
    <button class="btn btn-solid" id="lockOk" onclick="tryUnlock()">OK</button>
    <a class="lock-forgot" id="lockForgot" onclick="lockReset()"></a>
  </div>
</div>

<script>
/* ================= I18N ================= */
const I18N = {

 pw_title:'Пароль', cancel:'Отмена', close:'Закрыть',

const LOCALES = {ru:'ru-RU', it:'it-IT', en:'en-GB', ua:'uk-UA'};

/* ================= STATE ================= */
const KEY = 'origin_v1';
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {settings:{lang:'ru', theme:'dark', myName:'', fontScale:1}, events:[], start:Date.now()};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function T(){ return I18N[S.settings.lang]; }
let curTab = 'dash';

/* ================= RENDER ================= */
function renderAll(){
  const t = T();
  document.documentElement.lang = S.settings.lang;
  const d = new Date();
  document.getElementById('hDate').textContent =
    d.toLocaleDateString(LOCALES[S.settings.lang], {weekday:'short', day:'numeric', month:'long'});
  ['tabDashL','tabTodayL','tabDataL','tabOptsL'].forEach((id,i)=>document.getElementById(id).textContent = t.nav[i]);
  document.getElementById('todaySec').textContent = t.nav[1];
  document.getElementById('dataSec').textContent = t.nav[2];
  document.getElementById('optsSec').textContent = t.nav[3];
  ['phDash','phToday','phData'].forEach(id=>document.getElementById(id).textContent = t.ph);
  document.getElementById('lblLang').textContent = t.lang;
  document.getElementById('lblTheme').textContent = t.theme;
  document.getElementById('chipDark').textContent = t.dark;
  document.getElementById('chipLight').textContent = t.light;
  document.getElementById('lblFontT').textContent = t.fontsize;
  document.getElementById('fsNote').textContent = t.fontsize_note;
  document.getElementById('lblMyName').textContent = t.my_name;
  document.getElementById('inpMyName').value = S.settings.myName;
  document.getElementById('lblLock').textContent = t.lock;
  document.getElementById('chipPwSet').textContent = S.settings.pwHash ? t.pw_change : t.pw_set_btn;
  document.getElementById('chipPwRem').textContent = t.pw_remove;
  document.getElementById('chipPwRem').classList.toggle('hidden', !S.settings.pwHash);
  document.getElementById('lblConstructor').textContent = t.constructor;
  document.getElementById('lblManual').textContent = t.manual;
  document.getElementById('guideTitle').textContent = t.manual;
  document.getElementById('guideBody').innerHTML = t.guide.map(x=>'<section><h2>'+x[0]+'</h2>'+x[1].map(p=>'<p>'+p+'</p>').join('')+'</section>').join('');
  document.getElementById('contactTxt').textContent = t.contact;
  document.getElementById('contactClose').textContent = t.close;
  document.getElementById('pwCancel').textContent = t.cancel;
  document.getElementById('cfCancel').textContent = t.cancel;
  document.getElementById('lockText').textContent = t.lock_enter;
  document.getElementById('lockForgot').textContent = t.lock_forgot;
  document.querySelectorAll('#langChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.lang===S.settings.lang));
  document.getElementById('chipDark').classList.toggle('on', S.settings.theme==='dark');
  document.getElementById('chipLight').classList.toggle('on', S.settings.theme==='light');
  document.body.classList.toggle('light', S.settings.theme==='light');
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.content = S.settings.theme==='light' ? '#F6F5F1' : '#0E0E10';
  applyFontScale();
}

/* ================= SETTINGS ================= */
document.getElementById('langChips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  S.settings.lang = c.dataset.lang; save(); renderAll();
});
function setTheme(t){ S.settings.theme = t; save(); renderAll(); }
function setName(v){ S.settings.myName = v.trim(); save(); }
function setFontScale(v){ S.settings.fontScale = v/100; save(); applyFontScale(); }
function applyFontScale(){
  const f = S.settings.fontScale || 1;
  document.documentElement.style.setProperty('--fs', f);
  const el = document.getElementById('fsVal');
  if(el) el.textContent = Math.round(f*100) + '%';
  const sl = document.getElementById('fsSlider');
  if(sl) sl.value = Math.round(f*100);
}

/* ================= LOCK ================= */
function b64(u8){ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
async function hashPw(p){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('origin::'+p));
  return b64(new Uint8Array(d));
}
function askPassword(text, maxlen){
  return new Promise(res=>{
    const m = document.getElementById('pwModal');
    document.getElementById('pwTitle').textContent = T().pw_title;
    document.getElementById('pwText').textContent = text;
    const inp = document.getElementById('pwInput'); inp.value='';
    if(maxlen) inp.maxLength = maxlen; else inp.removeAttribute('maxlength');
    m.classList.add('open'); setTimeout(()=>inp.focus(),60);
    const done = v=>{ m.classList.remove('open');
      document.getElementById('pwOk').onclick=null; document.getElementById('pwCancel').onclick=null; inp.onkeydown=null; res(v); };
    document.getElementById('pwOk').onclick = ()=>done(inp.value);
    document.getElementById('pwCancel').onclick = ()=>done(null);
    inp.onkeydown = e=>{ if(e.key==='Enter') done(inp.value); };
  });
}
function confirmBox(title, text, okLabel){
  return new Promise(res=>{
    const m = document.getElementById('cfModal');
    document.getElementById('cfTitle').textContent = title;
    document.getElementById('cfText').textContent = text;
    document.getElementById('cfOk').textContent = okLabel || 'OK';
    m.classList.add('open');
    const done = v=>{ m.classList.remove('open');
      document.getElementById('cfOk').onclick=null; document.getElementById('cfCancel').onclick=null; res(v); };
    document.getElementById('cfOk').onclick = ()=>done(true);
    document.getElementById('cfCancel').onclick = ()=>done(false);
  });
}
async function setLockPw(){
  if(S.settings.pwHash){
    const cur = await askPassword(T().lock_cur, 6);
    if(cur===null) return;
    if(await hashPw(cur) !== S.settings.pwHash){ toast(T().lock_wrong); return; }
  }
  const p1 = await askPassword(T().lock_new, 6);
  if(!p1) return;
  if(p1.length > 6){ toast(T().lock_max); return; }
  const p2 = await askPassword(T().lock_repeat, 6);
  if(p2===null) return;
  if(p1 !== p2){ toast(T().lock_mismatch); return; }
  S.settings.pwHash = await hashPw(p1);
  save(); renderAll(); toast(T().lock_set_done);
}
async function removeLockPw(){
  const cur = await askPassword(T().lock_cur, 6);
  if(cur===null) return;
  if(await hashPw(cur) !== S.settings.pwHash){ toast(T().lock_wrong); return; }
  delete S.settings.pwHash;
  save(); renderAll(); toast(T().lock_removed);
}
async function tryUnlock(){
  const inp = document.getElementById('lockInput');
  if(await hashPw(inp.value) === S.settings.pwHash){
    document.getElementById('lockScreen').classList.remove('show');
    inp.value=''; inp.blur();
  }else{
    toast(T().lock_wrong); inp.value=''; inp.focus();
  }
}
async function lockReset(){
  const ok = await confirmBox(T().wipe_t, T().lock_reset_warn, T().wipe_btn_ok);
  if(!ok) return;
  localStorage.removeItem(KEY);
  S = load(); save();
  document.getElementById('lockScreen').classList.remove('show');
  renderAll(); toast(T().wipe_done);
}

/* ================= NAV / GUIDE / MISC ================= */
function show(id){
  curTab = id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('on');
}
function openManual(){
  const g = document.getElementById('guideModal');
  g.classList.add('show'); g.scrollTop = 0;
}
function closeGuide(){ document.getElementById('guideModal').classList.remove('show'); }
function openContact(){ document.getElementById('contactModal').classList.add('open'); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function diag(){
  const app = document.getElementById('app');
  toast('win ' + window.innerHeight + ' · app ' + Math.round(app.getBoundingClientRect().height) +
        ' · scr ' + screen.height + ' · SA ' + (navigator.standalone===true ? 'yes' : 'no'));
}

/* ================= INIT ================= */
function setVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  requestAnimationFrame(()=>{
    const app = document.getElementById('app');
    if(!app) return;
    const gap = window.innerHeight - app.getBoundingClientRect().height;
    app.classList.toggle('vhfix', gap > 2);
  });
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', ()=>setTimeout(setVH, 120));
if(window.visualViewport) window.visualViewport.addEventListener('resize', setVH);
if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
renderAll();
save();
if(S.settings.pwHash){
  document.getElementById('lockScreen').classList.add('show');
  setTimeout(()=>document.getElementById('lockInput').focus(), 150);
}
document.getElementById('lockInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
</script>
